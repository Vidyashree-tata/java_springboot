name: CI/CD Pipeline

on:
  push:
    branches:
      - trans_planner

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DOCKER_CREDENTIALS_ID: ${{ secrets.DOCKER_CREDENTIALS_ID }}
      DOCKER_REGISTRY_URL: 'http://10.75.12.85:8085'
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: 'http://10.75.12.85:9000'

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v2
      with:
        repository: 'ssh://42641@tegerrit.tataelxsi.co.in:29418/TE_JIOBPTRANSONNECT'
        ref: 'trans_planner'
        token: ${{ secrets.GITHUB_TOKEN }}

    # Uncomment the following steps if you want to include SonarQube analysis
